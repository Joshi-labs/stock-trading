name: Build and Push to GHCR

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'generator.py'
      - 'consumer.py'
      - 'Dockerfile.generator'
      - 'Dockerfile.consumer'
      - 'requirements.txt'
      - '.github/workflows/docker-build.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ lower(github.repository) }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Generator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.generator
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/generator:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/generator:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Consumer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.consumer
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/consumer:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/consumer:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Redpanda image (alias)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.generator
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/generator:latest
          labels: ${{ steps.meta.outputs.labels }}

  notify:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Success message
        run: echo "✅ Images pushed to GHCR successfully!"