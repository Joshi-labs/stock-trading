name: Build and Push to GHCR

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'generator.py'
      - 'consumer.py'
      - 'Dockerfile.generator'
      - 'Dockerfile.consumer'
      - 'requirements.txt'
      - '.github/workflows/docker-build.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repo name
        id: repo
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Generator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.generator
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/generator:latest,ghcr.io/${{ steps.repo.outputs.name }}/generator:${{ github.sha }}

      - name: Build and push Consumer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.consumer
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/consumer:latest,ghcr.io/${{ steps.repo.outputs.name }}/consumer:${{ github.sha }}

  notify:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Success message
        run: echo "✅ Images pushed to GHCR successfully!"